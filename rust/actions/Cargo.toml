[package]
name = "actions"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
prost = "0.13"
tokio = { version = "1.38", features = ["rt", "macros"] }
tonic = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
