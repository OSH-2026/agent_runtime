syntax = "proto3";

package actions;

service ActionService {
  rpc Execute (ActionRequest) returns (ActionResponse);
}

message ActionRequest {
  string action_name = 1;
  bytes payload = 2;
  map<string, string> metadata = 3;
}

message ActionResponse {
  bool success = 1;
  bytes result = 2;
  ActionError error = 3;
}

message ActionError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}
