<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b18" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Action Chat</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <p class="eyebrow">ACTION FABRIC</p>
            <h1>Action Chat</h1>
          </div>
        </div>
        <div class="connection-pill">
          <span class="connection-dot"></span>
          <span id="connection-label">就绪</span>
        </div>
      </header>

      <section class="workspace">
        <section class="chat-panel">
          <div id="messages" class="messages" aria-live="polite">
            <article class="message assistant-message welcome-message">
              <div class="avatar">A</div>
              <div class="message-body">
                <p>你好，我可以回答问题，也可以规划并执行设备 workflow。</p>
                <div class="suggestions">
                  <button class="suggestion" data-prompt="查看当前设备、网络和电量状态，并给我一份简洁摘要。">
                    设备状态摘要
                  </button>
                  <button class="suggestion" data-prompt="查看当前正在播放的媒体。">
                    正在播放什么
                  </button>
                  <button class="suggestion" data-prompt="读取剪贴板内容并告诉我重点。">
                    总结剪贴板
                  </button>
                </div>
              </div>
            </article>
          </div>

          <form id="composer" class="composer">
            <textarea
              id="message-input"
              rows="1"
              placeholder="输入问题或设备任务…"
              aria-label="聊天消息"
            ></textarea>
            <button id="send-button" class="send-button" type="submit" aria-label="发送">
              <span>发送</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12 14-7-4.8 14-2.7-5.2L5 12Z"></path>
              </svg>
            </button>
          </form>
          <p class="composer-note">高风险操作执行前会请求你的确认</p>
        </section>

        <aside class="activity-panel">
          <div class="activity-header">
            <div>
              <p class="eyebrow">LIVE TRACE</p>
              <h2>运行过程</h2>
            </div>
            <button id="settings-button" class="icon-button" type="button" aria-label="模型设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
              </svg>
            </button>
          </div>
          <div id="activity-empty" class="activity-empty">
            <div class="empty-orbit"><span></span></div>
            <strong>等待任务</strong>
            <p>模型调用和 workflow 节点状态会显示在这里。</p>
          </div>
          <ol id="activity-list" class="activity-list"></ol>
        </aside>
      </section>
    </main>

    <div id="settings-overlay" class="overlay hidden" aria-hidden="true">
      <section class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">CONNECTIONS</p>
            <h2 id="settings-title">运行设置</h2>
          </div>
          <button id="close-settings" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <label for="model-url">OpenAI-compatible chat completions URL</label>
        <input id="model-url" value="http://10.0.2.2:8080/v1/chat/completions" spellcheck="false" />
        <label for="model-name">模型</label>
        <input id="model-name" value="local-model" spellcheck="false" />
        <label for="api-key">API Key（可选）</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="不会写入 workflow" />
        <label for="grpc-endpoint">Android Action Runtime</label>
        <input id="grpc-endpoint" value="127.0.0.1:8080" spellcheck="false" />
        <div class="settings-grid">
          <div>
            <label for="temperature">Temperature</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2" />
          </div>
          <div>
            <label for="max-turns">最大循环轮次</label>
            <input id="max-turns" type="number" min="1" max="16" value="8" />
          </div>
        </div>
        <button id="save-settings" class="primary-button" type="button">保存设置</button>
      </section>
    </div>

    <div id="confirmation-overlay" class="overlay hidden" aria-hidden="true">
      <section class="dialog confirmation-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmation-title">
        <div class="risk-icon">!</div>
        <p class="eyebrow">ACTION CONFIRMATION</p>
        <h2 id="confirmation-title">允许执行此操作？</h2>
        <strong id="confirmation-action" class="confirmation-action"></strong>
        <p id="confirmation-meta" class="confirmation-meta"></p>
        <details open>
          <summary>查看输入参数</summary>
          <pre id="confirmation-inputs"></pre>
        </details>
        <div class="confirmation-actions">
          <button id="reject-button" class="secondary-button" type="button">拒绝</button>
          <button id="approve-button" class="primary-button" type="button">允许执行</button>
        </div>
      </section>
    </div>
  </body>
</html>
