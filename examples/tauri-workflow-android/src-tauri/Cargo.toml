[package]
name = "tauri-workflow-android"
version = "0.1.0"
description = "Android Tauri workflow runner backed by the Action Fabric dispatcher"
authors = ["Action Fabric contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_workflow_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
actions = { path = "../../../rust/actions" }
dispatcher = { path = "../../../rust/dispatcher" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
